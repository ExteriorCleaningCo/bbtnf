<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BBTNF">
<meta name="theme-color" content="#1A1A1A">
<style>
  :root{
    --red:#111111; --red-dark:#000000; --red-soft:#EDEDED;
    --ink:#1A1A1A; --paper:#F7F5F0; --card:#FFFFFF; --line:#E6E2D8; --muted:#6B6B66;
    --green:#111111; --green-soft:#EDEDED; --amber:#CFCFCF; --amber-soft:#EEEEEE;
    --radius:16px; --shadow:0 2px 10px rgba(26,26,26,.07);
    --display:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'SF Mono',Menlo,Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
  button,input,select{font-family:inherit;font-size:16px}
  button{cursor:pointer}
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

  header.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
  header.top img{width:42px;height:42px;flex:0 0 42px}
  header.top .t1{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.3px;line-height:1.1}
  header.top .t2{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#C9C9C2;margin-top:3px}

  #banner{display:none;background:var(--amber);color:var(--ink);font-size:13px;font-weight:500;text-align:center;padding:8px 12px}
  #banner.bad{background:var(--red);color:#fff}

  main{flex:1;padding:16px 16px 28px;width:100%;max-width:640px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}

  nav.tabs{position:sticky;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
    gap:2px;padding:7px 0;color:var(--muted);font-size:11px;font-weight:500;border-radius:10px}
  nav.tabs button .ic{font-size:19px;line-height:1}
  nav.tabs button.active{color:var(--red)}

  h2{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.4px;margin:0}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .section-title{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}

  /* hero */
  .hero{background:#fff;color:var(--ink);border-radius:20px;padding:18px 14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .hero-label{text-align:center;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .hero-score{display:flex;align-items:stretch;justify-content:center;gap:10px;margin:14px 0 12px}
  .side{flex:1;border-radius:14px;padding:12px 6px;text-align:center}
  .side.reds{background:var(--red);color:#fff}
  .side.whites{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  .side-name{font-size:12px;font-weight:600;letter-spacing:1.5px}
  .side-num{font-family:var(--mono);font-weight:500;font-size:52px;line-height:1.05;font-variant-numeric:tabular-nums}
  .vs{align-self:center;font-weight:500;color:var(--muted);font-size:14px}
  .pips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:7px}
  .pips i{width:12px;height:12px;border-radius:50%;border:2px solid #CFCFCF}
  .pips.reds i.on{background:var(--red);border-color:var(--red)}
  .pips.whites i.on{background:#8C8C8C;border-color:#8C8C8C}
  .hero-note{text-align:center;font-size:13px;margin-top:12px;color:var(--ink)}
  .hero.done .hero-note{font-weight:600;color:var(--ink);font-size:15px}

  /* match cards */
  .match{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
  .m-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
  .m-score{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 8px;font-weight:600}
  .m-score .num{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums}
  .m-score .dash{color:var(--muted)}
  .m-score .tn{font-size:13px;letter-spacing:.5px}
  .m-scorers{font-size:13.5px;line-height:1.5}
  .m-scorers b{font-weight:600}
  .m-scorers .r{color:var(--red-dark)}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.4px}
  .badge.reds{background:var(--red);color:#fff}
  .badge.whites{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .badge.draw{background:var(--line);color:var(--muted)}

  .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .chip.reds{background:var(--red);color:#fff}
  .chip.whites{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .chip.none{background:var(--line);color:var(--muted)}

  details.fold{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:0 14px;margin-bottom:12px}
  details.fold>summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::before{content:'▸';color:var(--muted);font-size:12px;transition:transform .15s}
  details.fold[open]>summary::before{transform:rotate(90deg)}
  details.fold>.fold-body{padding-bottom:14px}
  details.fold .match{box-shadow:none;border:1px solid var(--line)}

  /* teams */
  .teams-grid{display:grid;grid-template-columns:1fr;gap:12px}
  .team{border-top:6px solid var(--ink)}
  .team.reds{border-top-color:var(--red)}
  .team.whites{border-top-color:#C9C9C2}
  .team-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px}
  .prow:last-child{border-bottom:none}
  .pname{font-weight:500}
  .pgoals{font-family:var(--mono);font-weight:500;font-size:14px}

  /* scorers */
  .seg{display:flex;background:#fff;border-radius:12px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
  .seg button{flex:1;border:none;background:none;padding:10px;font-weight:600;font-size:13px;color:var(--muted);border-radius:9px}
  .seg button.active{background:var(--ink);color:#fff}
  .srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:none}
  .rank{width:30px;text-align:center;font-family:var(--mono);font-weight:500;color:var(--muted);font-size:15px}
  .srow.top .rank{color:var(--red);font-size:20px}
  .sinfo{flex:1;min-width:0}
  .sname{font-weight:600;font-size:16px}
  .sbar{height:6px;border-radius:4px;background:var(--line);margin-top:7px}
  .sbar i{display:block;height:100%;border-radius:4px;background:var(--red)}
  .sgoals{font-family:var(--mono);font-weight:500;font-size:22px;min-width:34px;text-align:right}

  /* availability */
  .me-box{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .me-box label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .me-box select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-weight:500;background:#fff;color:var(--ink)}
  .ans{display:flex;gap:8px;margin-top:12px}
  .ans button{flex:1;padding:14px 4px;border-radius:12px;border:2px solid var(--line);font-weight:500;font-size:14px;background:#fff;color:var(--ink)}
  .ans button.in.sel{background:var(--green);color:#fff}
  .ans button.maybe.sel{background:var(--amber);color:var(--ink)}
  .ans button.out.sel{background:#fff;color:var(--ink);border-color:var(--ink);text-decoration:line-through}
  .sumrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .sum{flex:1;min-width:70px;text-align:center;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px 4px}
  .sum b{display:block;font-family:var(--mono);font-size:22px}
  .sum span{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:500}
  .arow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .arow:last-child{border-bottom:none}
  .pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--line);color:var(--muted)}
  .pill.in{background:var(--ink);color:#fff}
  .pill.maybe{background:var(--amber-soft);color:#333333}
  .pill.out{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .mini{display:flex;gap:5px}
  .mini button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:600}
  .mini button.sel.in{background:var(--green);color:#fff;border-color:var(--green)}
  .mini button.sel.maybe{background:var(--amber);border-color:var(--amber)}
  .mini button.sel.out{background:#fff;color:var(--ink);border-color:var(--ink);text-decoration:line-through}

  /* admin */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select.f{
    width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:12px;padding:13px 16px;font-weight:600;font-size:15px}
  .btn.red{background:var(--red)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.full{width:100%}
  .btn.sm{padding:9px 12px;font-size:13px}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row>.grow{flex:1;min-width:120px}
  .score-row{display:flex;gap:10px;margin-bottom:14px}
  .score-side{flex:1;border-radius:14px;padding:12px 6px;text-align:center}
  .score-side.reds{background:var(--red);color:#fff}
  .score-side.whites{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  .score-side .nm{font-size:12px;font-weight:600;letter-spacing:1.4px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
  .stepper button{width:44px;height:44px;border-radius:50%;border:none;font-size:24px;font-weight:600;background:rgba(0,0,0,.14);color:inherit}
  .score-side.whites .stepper button{background:var(--line)}
  .stepper .v{font-family:var(--mono);font-size:30px;font-weight:500;min-width:36px;text-align:center}
  .gstep{display:flex;align-items:center;gap:6px}
  .gstep button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:600}
  .gstep .v{min-width:24px;text-align:center;font-family:var(--mono);font-weight:500;font-size:18px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:6px 6px 6px 12px;font-weight:500;font-size:13.5px}
  .tag button{border:none;background:var(--line);width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:600;line-height:1}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .warn{background:var(--amber-soft);color:#333333;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500;margin-bottom:12px}
  .err{color:var(--red-dark);font-size:13px;font-weight:500;min-height:18px;margin-top:8px}
  .editbar{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .adminrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  .adminrow:last-child{border-bottom:none}
  .tbtns{display:flex;gap:5px}
  .tbtns button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600}
  .tbtns button.sel.reds{background:var(--red);color:#fff;border-color:var(--red)}
  .tbtns button.sel.whites{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  .tbtns button.sel.none{background:var(--line)}
  .linkbtn{background:none;border:none;color:var(--red-dark);font-weight:600;font-size:13px;padding:6px}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:500;
    font-size:13.5px;padding:10px 18px;border-radius:30px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
  #toast.show{opacity:1}
  #confirm{position:fixed;inset:0;background:rgba(26,26,26,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:24px}
  #confirm.open{display:flex}
  #confirm .box{background:#fff;border-radius:18px;padding:20px;max-width:340px;width:100%;text-align:center}
  #confirm p{margin:0 0 16px;font-size:15px;line-height:1.45}
  #confirm .row{flex-wrap:nowrap}
  #confirm .row button{flex:1}

  /* pub fines */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fchip{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-weight:500;font-size:13.5px;color:var(--ink);line-height:1.2}
  .fchip b{font-family:var(--mono);font-size:13px;white-space:nowrap}
  .fchip.rw{background:var(--green-soft);border-color:#CFCFCF;color:var(--green)}
  .fhero{background:var(--ink);color:#fff;border-radius:20px;padding:20px 14px 16px;margin-bottom:14px;text-align:center;box-shadow:var(--shadow)}
  .fhero .big{font-family:var(--mono);font-weight:500;font-size:46px;line-height:1.05;margin-top:6px}
  .pf{border-bottom:1px solid var(--line)}
  .pf:last-child{border-bottom:none}
  .pf>summary{list-style:none;cursor:pointer;padding:12px 0;display:block}
  .pf>summary::-webkit-details-marker{display:none}
  .pf-main{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .pf-amt{font-family:var(--mono);font-weight:500;font-size:17px}
  .pf-sub{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .pf-body{padding:2px 0 12px}
  .erow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
  .erow .el{flex:1;min-width:120px}
  .erow .ed{font-size:12px;color:var(--muted)}
  .erow .ea{font-family:var(--mono);font-weight:500}
  .erow .ea.neg{color:var(--green)}
  .paidbtn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600}
  .paidbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
  nav.tabs button{font-size:10px}
  header.top .t1{font-weight:500;letter-spacing:4px;font-size:20px}

  b,strong{font-weight:600}
  nav.tabs .ic{filter:grayscale(1);opacity:.75}
  nav.tabs button.active .ic{opacity:1;filter:grayscale(1) contrast(1.4)}
  h2{font-weight:600}
  .side-num,.fhero .big,.stepper .v{font-weight:300}
  .fhero .hero-label{color:#C9C9C2}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;color:var(--ink)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-h{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.6px;padding:4px 0}
  .cal-d{height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;position:relative}
  .cal-d.off{color:#C4C1B8}
  .cal-d.mon{border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:500}
  .cal-d.mon.sel{background:var(--ink);color:#fff}
  .cal-d.mon.nx::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:currentColor}
  .cal-d.today{text-decoration:underline}
  .teamsrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tcol{padding:14px 12px;margin-bottom:0;min-width:0}
  .tcol.reds{background:var(--ink);color:#fff}
  .tcol.whites{border:2px solid var(--ink)}
  .tc-head{font-size:12px;letter-spacing:1.5px;font-weight:600}
  .tc-cap{margin:8px 0 10px;padding:8px;border-radius:10px;background:rgba(128,128,128,.2)}
  .tc-cap span{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
  .tc-cap b{font-size:16px}
  .tc-p{padding:6px 0;font-size:14.5px;border-top:1px solid rgba(128,128,128,.3)}
  .cbtn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:500;color:var(--ink)}
  .cbtn.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cbadge{display:inline-block;font-size:10px;font-weight:600;border:1.5px solid currentColor;border-radius:50%;width:19px;height:19px;line-height:16px;text-align:center;margin-left:6px;vertical-align:middle}
  .finrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .finrow.total{border-bottom:none;font-weight:600;font-size:17px;padding-top:12px}
  .finrow span:last-child{font-family:var(--mono)}
</style>
</head>

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const byName = (a,b) => a.name.localeCompare(b.name);
function dayOf(s){ return new Date(s + 'T12:00:00'); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function isMonday(s){ return !!s && dayOf(s).getDay() === 1; }
function upcomingMonday(){ const d = new Date(); d.setHours(12,0,0,0); while(d.getDay() !== 1) d.setDate(d.getDate() + 1); return ymd(d); }
function lastMonday(){ const d = new Date(); d.setHours(12,0,0,0); while(d.getDay() !== 1) d.setDate(d.getDate() - 1); return ymd(d); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDate(s, long){
  if(!s) return '';
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('en-GB', long
    ? {weekday:'long', day:'numeric', month:'long', year:'numeric'}
    : {weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
let confirmCb = null;
function askConfirm(msg, cb){ confirmCb = cb; $('#confirmMsg').textContent = msg; $('#confirm').classList.add('open'); }
function showBanner(msg, bad){ const b = $('#banner'); b.textContent = msg; b.className = bad ? 'bad' : ''; b.style.display = 'block'; }
function hideBanner(){ $('#banner').style.display = 'none'; }

/* ================= data ================= */
function defaultFines(){ return { season:1, types:[], rewards:[], entries:[] }; }
function defaultLeague(){ return { name:'BBTNF Reds v Whites', target:10, seriesNo:1, players:[], matches:[], nextMatch:'', fines:defaultFines(), captains:{reds:'',whites:''}, seriesMeta:{}, weeks:{}, fee:5, finance:{opening:0,entries:[]} }; }
function normalize(d){
  const o = Object.assign(defaultLeague(), d || {});
  o.players = o.players || []; o.matches = o.matches || [];
  o.target = Number(o.target) || 10; o.seriesNo = Number(o.seriesNo) || 1;
  const f = Object.assign(defaultFines(), o.fines || {});
  f.types = f.types || []; f.rewards = f.rewards || []; f.entries = f.entries || []; f.season = Number(f.season) || 1;
  o.fines = f;
  o.captains = Object.assign({ reds:'', whites:'' }, o.captains || {});
  o.seriesMeta = o.seriesMeta || {}; o.weeks = o.weeks || {};
  o.fee = (o.fee === undefined || o.fee === null || isNaN(Number(o.fee))) ? 5 : Number(o.fee);
  const fin = Object.assign({ opening:0, entries:[] }, o.finance || {});
  fin.entries = fin.entries || []; fin.opening = Number(fin.opening) || 0; o.finance = fin;
  return o;
}
let league = null;          // null until the cloud (or cache) gives us something
let loaded = false;
let availBy = {}, unsubs = {}, availDate = '', calMonth = '';   // availability replies per Monday
let user = null;            // set when the editor PIN has been entered on this device
try{ if(localStorage.getItem(LS_EDITOR) === '1') user = { editor:true }; }catch(e){}
let db = null;
let scorerScope = 'series';
let currentTab = 'home';
let adminOpen = { add:true };
let form = newForm();
let feeDate = '', finDate = '';
let pendingAdminRender = false, pendingFinesRender = false;
let finePid = '', fineDate = todayStr(), fineOpen = {};
const STD_FINES = [['Bad Shot',1],['Bad Passing',1],['Bad Tackle',1],['Megs',1],['Stupid False Calling',1],['Goalkeeper Howler',1],['Temper Tantrum',1],['No Pub',1],['Clearing Small Fence',1],['Losing Head',2],['Clearing Nantwich Town Fence',2.5],['GK Conceding 3+ Goals',2.5],['Giving Away a Penalty',2.5],['Missing Penalty',5]];
const STD_REWARDS = [['GK Clean Sheet',2],['Hattrick',2]];

try{ const c = localStorage.getItem(LS_CACHE); if(c){ league = normalize(JSON.parse(c)); loaded = true; } }catch(e){}

function newForm(){ return { id:null, seriesNo:null, date:lastMonday(), reds:0, whites:0, scorers:[], sg:1 }; }

/* ---- series maths ---- */
function matchesOf(n){ return (league ? league.matches : []).filter(m => (m.seriesNo || 1) === n); }
function sortedMatches(n){ return matchesOf(n).slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')); }
function seriesState(n){
  let r = 0, w = 0;
  matchesOf(n).forEach(m => { if(m.reds > m.whites) r++; else if(m.whites > m.reds) w++; });
  const target = league.target;
  const complete = r >= target || w >= target;
  const winner = complete ? (r > w ? 'reds' : (w > r ? 'whites' : null)) : null;
  return { r, w, complete, winner };
}
function goalsMap(seriesNo){
  const map = {};
  (league ? league.matches : []).forEach(m => {
    if(seriesNo != null && (m.seriesNo || 1) !== seriesNo) return;
    (m.scorers || []).forEach(s => {
      const k = s.playerId;
      if(!map[k]) map[k] = { playerId:k, name:s.name, team:s.team, goals:0 };
      map[k].goals += Number(s.goals) || 0;
    });
  });
  Object.values(map).forEach(x => {
    const p = league.players.find(p => p.id === x.playerId);
    if(p){ x.name = p.name; x.team = p.team || x.team; }
  });
  return map;
}

/* ---- writes ---- */
async function mutate(fn){
  if(!db){ toast('Not connected'); return false; }
  const ref = db.collection('league').doc('main');
  try{
    await db.runTransaction(async t => {
      const s = await t.get(ref);
      const cur = s.exists ? normalize(s.data()) : defaultLeague();
      fn(cur);
      t.set(ref, cur);
    });
    return true;
  }catch(e){
    console.error(e);
    if(e && e.code === 'permission-denied') toast("Couldn't save — check the Firebase rules");
    else toast("Couldn't save — check your connection");
    return false;
  }
}
function nextDate(){ return (league && league.nextMatch) ? league.nextMatch : upcomingMonday(); }
async function setAvailability(pid, status){
  const date = availDate || nextDate();
  if(!db || !league || !date){ return; }
  try{
    await db.collection('availability').doc(date).set({ responses:{ [pid]:{ s:status, t:Date.now() } } }, { merge:true });
  }catch(e){ console.error(e); toast("Couldn't save — check your connection"); }
}

/* ================= rendering ================= */
function emptyLeague(){
  return '<div class="card empty"><b>Nothing here yet</b>The league hasn\'t been set up. An admin can do this from the Admin tab.</div>';
}
function teamChip(t){

function availCounts(date){
  const av = availBy[date] || {};
  const c = { in:0, maybe:0, out:0, none:0, redsIn:0, whitesIn:0 };
  (league ? league.players : []).forEach(p => {
    const r = av[p.id];
    if(r && c[r.s] != null){ c[r.s]++; if(r.s === 'in'){ if(p.team === 'reds') c.redsIn++; else if(p.team === 'whites') c.whitesIn++; } }
    else c.none++;
  });
  return c;
}
function calendarHtml(){

function finStats(){
  let fees = 0, owed = 0, inn = 0, out = 0;
  Object.keys(league.weeks).forEach(d => { const rs = weekRows(d); Object.keys(rs).forEach(k => { if(rs[k].paid) fees += rs[k].amt; else owed += rs[k].amt; }); });
  league.finance.entries.forEach(e => { if(e.type === 'in') inn += e.amount; else out += e.amount; });
  const open = league.finance.opening;
  return { open, fees:r2(fees), owed:r2(owed), inn:r2(inn), out:r2(out), balance:r2(open + fees + inn - out) };

function refreshForm(){
  if(!$('#fRed')) return;
  $('#fRed').textContent = form.reds; $('#fWhite').textContent = form.whites; $('#fSG').textContent = form.sg;
  $('#fTags').innerHTML = form.scorers.map((s,i) => '<span class="tag">' + esc(s.name) + (s.goals > 1 ? ' ×' + s.goals : '') + ' <button data-act="rmScorer" data-i="' + i + '" aria-label="Remove">✕</button></span>').join('');
  const lr = form.scorers.filter(s => s.team === 'reds').reduce((a,s) => a + s.goals, 0);
  const lw = form.scorers.filter(s => s.team === 'whites').reduce((a,s) => a + s.goals, 0);
  const bits = [];
  if(lr !== form.reds) bits.push('Reds: ' + lr + ' of ' + form.reds + ' goals have a scorer');
  if(lw !== form.whites) bits.push('Whites: ' + lw + ' of ' + form.whites + ' goals have a scorer');
  $('#fHint').textContent = bits.length ? bits.join(' · ') + ' (own goals can be left out)' : (form.scorers.length ? 'All goals have a scorer ✓' : '');
  $('#saveBtn').textContent = form.id ? 'Save changes' : 'Save result';
}

/* ---- pub fines ---- */
const r2 = n => Math.round(n * 100) / 100;
const money = n => '£' + r2(n).toFixed(2);
function curEntries(){ const f = league.fines; return f.entries.filter(e => (e.season || 1) === f.season); }
function renderFines(force){
  const el = $('#finesBody'); if(!el) return;
  const ae = document.activeElement;
  if(!force && ae && el.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')){ pendingFinesRender = true; return; }
  pendingFinesRender = false;
  if(!league){ el.innerHTML = loaded ? emptyLeague() : '<div class="empty">Loading…</div>'; return; }
  const f = league.fines, ents = curEntries(), edit = !!user;

  // per-player stats
  const map = {};
  league.players.forEach(p => { map[p.id] = { id:p.id, name:p.name, fined:0, rew:0, coll:0, ents:[] }; });
  ents.forEach(e => {
    const k = e.playerId;
    if(!map[k]) map[k] = { id:k, name:e.name, fined:0, rew:0, coll:0, ents:[] };
    const m = map[k]; m.ents.push(e);
    if(e.amount > 0){ m.fined += e.amount; if(e.paid) m.coll += e.amount; } else m.rew += -e.amount;
  });
  const rows = Object.values(map);
  rows.forEach(m => { m.owing = Math.max(0, r2(m.fined - m.rew - m.coll)); });
  let tFined = 0, tColl = 0, tOwing = 0;
  rows.forEach(m => { tFined += m.fined - m.rew; tColl += m.coll; tOwing += m.owing; });
  rows.sort((a,b) => (b.coll - a.coll) || (b.owing - a.owing) || a.name.localeCompare(b.name));

  let h = '<div class="fhero"><div class="hero-label">Collected to date · Season ' + f.season + '</div><div class="big">' + money(tColl) + '</div></div>' +
    '<div class="sumrow"><div class="sum"><b>' + money(tFined) + '</b><span>Fined</span></div><div class="sum"><b>' + money(tColl) + '</b><span>Collected</span></div><div class="sum"><b>' + money(tOwing) + '</b><span>Owing</span></div></div>';

  if(edit){
    const opts = '<option value="">Pick a player…</option>' + league.players.slice().sort(byName).map(p => '<option value="' + esc(p.id) + '"' + (p.id === finePid ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
    h += '<div class="card"><h2>Add a fine</h2>' +
      '<div class="field" style="margin-top:12px"><label for="fineDate">Date</label><input type="date" id="fineDate" value="' + esc(fineDate) + '"></div>' +
      '<div class="field"><label for="fPlayer">Player</label><select class="f" id="fPlayer">' + opts + '</select></div>';
    if(f.types.length) h += '<div class="fgrid">' + f.types.map(t => '<button class="fchip" data-act="addFine" data-kind="fine" data-id="' + esc(t.id) + '"><span>' + esc(t.name) + '</span><b>' + money(t.amount) + '</b></button>').join('') + '</div>';
    else h += '<div class="hint">No fine types yet. Open "Fine and reward types" at the bottom to add the standard list.</div>';
    if(f.rewards.length) h += '<div class="section-title" style="margin:16px 2px 8px">Rewards (take money off)</div><div class="fgrid">' + f.rewards.map(t => '<button class="fchip rw" data-act="addFine" data-kind="reward" data-id="' + esc(t.id) + '"><span>' + esc(t.name) + '</span><b>−' + money(t.amount) + '</b></button>').join('') + '</div>';
    h += '<div class="section-title" style="margin:16px 2px 8px">Something else</div><div class="row"><input type="text" id="fCustName" class="grow" placeholder="What for?" maxlength="40"><input type="number" id="fCustAmt" inputmode="decimal" step="0.5" min="0" placeholder="£" style="width:90px"></div>' +
      '<div class="row" style="margin-top:8px"><button class="btn sm grow" data-act="addCustom" data-kind="fine">Add fine</button><button class="btn ghost sm grow" data-act="addCustom" data-kind="reward">Add reward</button></div></div>';
  } else {
    h += '<div class="hint" style="margin:-4px 2px 12px">Editors: enter the PIN in the Admin tab to add fines.</div>';
  }

  h += '<div class="section-title">Players · % of pot</div><div class="card" style="padding:4px 16px">';
  h += rows.map(m => {
    const pct = tColl > 0 ? Math.round(m.coll / tColl * 100) : 0;
    const key = 'p:' + m.id;
    const list = m.ents.slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')).map(e =>
      '<div class="erow"><div class="el"><div>' + esc(e.label) + '</div><div class="ed">' + esc(fmtDate(e.date)) + '</div></div>' +
      '<span class="ea' + (e.amount < 0 ? ' neg' : '') + '">' + (e.amount < 0 ? '−' : '') + money(Math.abs(e.amount)) + '</span>' +
      (e.amount > 0 ? (edit ? '<button class="paidbtn' + (e.paid ? ' on' : '') + '" data-act="togglePaid" data-id="' + esc(e.id) + '">' + (e.paid ? 'Paid ✓' : 'Mark paid') + '</button>' : '<span class="pill' + (e.paid ? ' in' : '') + '">' + (e.paid ? 'Paid' : 'Owing') + '</span>') : '') +
      (edit ? '<button class="linkbtn" data-act="delEntry" data-id="' + esc(e.id) + '" aria-label="Delete">✕</button>' : '') + '</div>').join('');
    return '<details class="pf" data-fkey="' + esc(key) + '"' + (fineOpen[key] ? ' open' : '') + '><summary><div class="pf-main"><span class="pname">' + esc(m.name) + '</span><span class="pf-amt">' + money(m.coll) + '</span></div>' +
      '<div class="sbar"><i style="width:' + pct + '%"></i></div><div class="pf-sub"><span>' + pct + '% of pot</span><span>' + (m.owing > 0 ? 'Owes ' + money(m.owing) : 'All paid') + '</span></div></summary>' +
      '<div class="pf-body">' + (list || '<div class="muted small">No fines yet.</div>') +
      (edit && m.owing > 0 ? '<button class="btn ghost sm full" style="margin-top:10px" data-act="payAll" data-pid="' + esc(m.id) + '">Mark everything paid (' + money(m.owing) + ')</button>' : '') + '</div></details>';
  }).join('') || '<div class="empty">No players yet.</div>';
  h += '</div>';

  const byDate = {};
  ents.forEach(e => { (byDate[e.date || ''] = byDate[e.date || ''] || []).push(e); });
  const dates = Object.keys(byDate).sort().reverse();
  h += '<div class="section-title">Weekly history</div>';
  h += dates.length ? dates.map(d => {
    const es = byDate[d]; let fi = 0, pa = 0;
    es.forEach(e => { fi += e.amount; if(e.amount > 0 && e.paid) pa += e.amount; });
    const key = 'w:' + d;
    return '<details class="fold" data-fkey="' + esc(key) + '"' + (fineOpen[key] ? ' open' : '') + '><summary><span>' + esc(fmtDate(d)) + '</span><span class="muted small" style="margin-left:auto">' + money(fi) + ' fined · ' + money(pa) + ' paid</span></summary><div class="fold-body">' +
      es.slice().sort((a,b) => a.name.localeCompare(b.name)).map(e => '<div class="erow"><div class="el"><b>' + esc(e.name) + '</b> · ' + esc(e.label) + '</div><span class="ea' + (e.amount < 0 ? ' neg' : '') + '">' + (e.amount < 0 ? '−' : '') + money(Math.abs(e.amount)) + '</span>' + (e.amount > 0 ? '<span class="pill' + (e.paid ? ' in' : '') + '">' + (e.paid ? 'Paid' : 'Owing') + '</span>' : '') + '</div>').join('') + '</div></details>';
  }).join('') : '<div class="card empty"><b>No fines yet</b>Fines added by the editors will show here week by week.</div>';

  if(edit){
    const typeRows = (arr, kind) => arr.map(t => '<div class="adminrow"><span class="pname">' + esc(t.name) + ' · ' + money(t.amount) + '</span><button class="linkbtn" data-act="delType" data-kind="' + kind + '" data-id="' + esc(t.id) + '">Remove</button></div>').join('');
    h += '<div class="section-title">Editor tools</div>' +
      '<details class="fold" data-fkey="mgr"' + (fineOpen.mgr ? ' open' : '') + '><summary>Fine and reward types</summary><div class="fold-body">' +
      (!f.types.length && !f.rewards.length ? '<button class="btn red full" data-act="seedFines" style="margin-bottom:12px">Add the standard BBTNF fines and rewards</button>' : '') +
      '<div class="muted small" style="font-weight:600;margin-bottom:4px">FINES</div>' + (typeRows(f.types, 'fine') || '<div class="muted small">None yet.</div>') +
      '<div class="row" style="margin:10px 0 18px"><input type="text" id="tName" class="grow" placeholder="New fine" maxlength="40"><input type="number" id="tAmt" inputmode="decimal" step="0.5" min="0" placeholder="£" style="width:80px"><button class="btn sm" data-act="addType" data-kind="fine">Add</button></div>' +
      '<div class="muted small" style="font-weight:600;margin-bottom:4px">REWARDS</div>' + (typeRows(f.rewards, 'reward') || '<div class="muted small">None yet.</div>') +
      '<div class="row" style="margin-top:10px"><input type="text" id="rName" class="grow" placeholder="New reward" maxlength="40"><input type="number" id="rAmt" inputmode="decimal" step="0.5" min="0" placeholder="£" style="width:80px"><button class="btn sm" data-act="addType" data-kind="reward">Add</button></div></div></details>' +
      '<details class="fold" data-fkey="season"' + (fineOpen.season ? ' open' : '') + '><summary>New fines season</summary><div class="fold-body"><p class="muted small" style="margin:0 0 12px">Starts the fines list again from £0. The old season is kept safely in the database but is no longer shown.</p><button class="btn ghost full" data-act="newSeason">Start season ' + (f.season + 1) + '</button></div></details>';
  }
  el.innerHTML = h;
}

/* ================= actions ================= */
async function addEntry(pid, label, amount){
  const p = league.players.find(p => p.id === pid); if(!p) return false;
  const date = fineDate || todayStr();
  const ok = await mutate(cur => { cur.fines.entries.push({ id:uid(), season:cur.fines.season, date, playerId:pid, name:p.name, label, amount:r2(amount), paid:false }); });
  if(ok) toast(p.name + ': ' + label + ' ' + (amount < 0 ? '−' : '') + money(Math.abs(amount)));
  return ok;
}
async function saveMatch(){
  if(!form.date){ toast('Pick a date'); return; }
  const editing = !!form.id;
  if(!editing && seriesState(league.seriesNo).complete){ toast('Series finished — start a new one first'); return; }
  const m = { id:form.id || uid(), seriesNo:form.seriesNo || league.seriesNo, date:form.date, reds:form.reds, whites:form.whites, scorers:form.scorers.map(s => Object.assign({}, s)) };
  const ok = await mutate(cur => {
    if(editing){ const i = cur.matches.findIndex(x => x.id === m.id); if(i >= 0) cur.matches[i] = m; else cur.matches.push(m); }
    else { m.seriesNo = cur.seriesNo; cur.matches.push(m); }
  });
  if(ok){ toast(editing ? 'Result updated' : 'Result saved'); form = newForm(); adminOpen.add = true; renderAdmin(true); }
}

document.addEventListener('click', async e => {
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ showTab(tabBtn.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const a = b.dataset.act;
  switch(a){
    case 'confirmNo': $('#confirm').classList.remove('open'); confirmCb = null; break;
    case 'confirmYes': { $('#confirm').classList.remove('open'); const cb = confirmCb; confirmCb = null; if(cb) cb(); break; }
    case 'scope': scorerScope = b.dataset.v; renderScorers(); break;
    case 'setme': { const me = localStorage.getItem(LS_ME); if(me) setAvailability(me, b.dataset.s); break; }
    case 'pickdate': availDate = b.dataset.d; calMonth = availDate.slice(0, 7); watchAvailability(); renderAvail(); break;
    case 'calprev': case 'calnext': { const pr = calMonth.split('-').map(Number); const d = new Date(pr[0], pr[1] - 1 + (a === 'calnext' ? 1 : -1), 1); calMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); renderAvail(); break; }
    case 'setpid': setAvailability(b.dataset.pid, b.dataset.s); break;
    case 'login': doLogin(); break;
    case 'logout': user = null; try{ localStorage.removeItem(LS_EDITOR); }catch(e){} renderAvail(); renderFines(true); renderAdmin(true); break;
    case 'startLeague': if(await mutate(() => {})) toast('League started'); break;
    case 'rd+': form.reds++; refreshForm(); break;
    case 'rd-': form.reds = Math.max(0, form.reds - 1); refreshForm(); break;
    case 'wh+': form.whites++; refreshForm(); break;
    case 'wh-': form.whites = Math.max(0, form.whites - 1); refreshForm(); break;
    case 'sg+': form.sg++; refreshForm(); break;
    case 'sg-': form.sg = Math.max(1, form.sg - 1); refreshForm(); break;
    case 'addScorer': {
      const sel = $('#fScorer'); if(!sel || !sel.value) break;
      const p = league.players.find(p => p.id === sel.value); if(!p) break;
      const ex = form.scorers.find(s => s.playerId === p.id);
      if(ex) ex.goals += form.sg; else form.scorers.push({ playerId:p.id, name:p.name, team:p.team || '', goals:form.sg });
      form.sg = 1; refreshForm(); break;
    }
    case 'rmScorer': form.scorers.splice(Number(b.dataset.i), 1); refreshForm(); break;
    case 'saveMatch': saveMatch(); break;
    case 'cancelEdit': form = newForm(); renderAdmin(true); break;
    case 'editMatch': {
      const m = league.matches.find(x => x.id === b.dataset.id); if(!m) break;
      form = { id:m.id, seriesNo:m.seriesNo || 1, date:m.date, reds:m.reds, whites:m.whites, scorers:(m.scorers || []).map(s => Object.assign({}, s)), sg:1 };
      adminOpen.add = true; renderAdmin(true); window.scrollTo(0, 0); break;
    }
    case 'delMatch': askConfirm('Delete this result? This changes the series score.', async () => {
      if(await mutate(cur => { cur.matches = cur.matches.filter(x => x.id !== b.dataset.id); })) toast('Result deleted');
    }); break;
    case 'team': await mutate(cur => { const p = cur.players.find(p => p.id === b.dataset.pid); if(p){ p.team = b.dataset.t; ['reds','whites'].forEach(t => { if(cur.captains[t] === p.id && p.team !== t) cur.captains[t] = ''; }); } }); break;
    case 'captain': await mutate(cur => { const p = cur.players.find(p => p.id === b.dataset.pid); if(p && p.team) cur.captains[p.team] = (cur.captains[p.team] === p.id) ? '' : p.id; }); break;
    case 'delAllPlayers': askConfirm('Remove ALL players? Past results keep their scorers.', async () => { if(await mutate(cur => { cur.players = []; cur.captains = { reds:'', whites:'' }; })) toast('All players removed'); }); break;
    case 'wkplay': await mutate(cur => { const p = cur.players.find(p => p.id === b.dataset.pid); if(!p) return; const w = cur.weeks[feeDate] || (cur.weeks[feeDate] = { rows:{} }); if(w.rows[p.id]) delete w.rows[p.id]; else w.rows[p.id] = { n:p.name, t:p.team || '', paid:false, amt:cur.fee }; if(!Object.keys(w.rows).length) delete cur.weeks[feeDate]; }); break;
    case 'wkpay': await mutate(cur => { const w = cur.weeks[feeDate]; if(w && w.rows[b.dataset.pid]) w.rows[b.dataset.pid].paid = !w.rows[b.dataset.pid].paid; }); break;
    case 'wkall': await mutate(cur => { const w = cur.weeks[feeDate] || (cur.weeks[feeDate] = { rows:{} }); cur.players.forEach(p => { if((p.team === 'reds' || p.team === 'whites') && !w.rows[p.id]) w.rows[p.id] = { n:p.name, t:p.team, paid:false, amt:cur.fee }; }); if(!Object.keys(w.rows).length) delete cur.weeks[feeDate]; }); break;
    case 'wkpayall': await mutate(cur => { const w = cur.weeks[feeDate]; if(w) Object.keys(w.rows).forEach(k => { w.rows[k].paid = true; }); }) && toast('All marked paid'); break;
    case 'finAdd': {
      const amt = parseFloat($('#finAmt').value); if(!(amt > 0)){ toast('Enter an amount'); break; }
      const kind = b.dataset.kind, note = ($('#finNote').value || '').trim() || (kind === 'in' ? 'Money in' : 'Money out'), date = finDate || todayStr();
      if(await mutate(cur => { cur.finance.entries.push({ id:uid(), date, type:kind, amount:r2(amt), note }); })) toast(kind === 'in' ? 'Money in saved' : 'Money out saved'); break;
    }
    case 'finDel': askConfirm('Delete this entry?', async () => { await mutate(cur => { cur.finance.entries = cur.finance.entries.filter(x => x.id !== b.dataset.id); }); }); break;
    case 'setFee': { const n = parseFloat($('#feeIn').value); if(!(n >= 0)){ toast('Enter the fee'); break; } if(await mutate(cur => { cur.fee = r2(n); })) toast('Fee saved'); break; }
    case 'setOpen': { const n = parseFloat($('#openIn').value); if(isNaN(n)){ toast('Enter an amount'); break; } if(await mutate(cur => { cur.finance.opening = r2(n); })) toast('Saved'); break; }
    case 'delPlayer': askConfirm('Remove this player? Their past goals stay in the results.', async () => {
      if(await mutate(cur => { cur.players = cur.players.filter(p => p.id !== b.dataset.pid); ['reds','whites'].forEach(t => { if(cur.captains[t] === b.dataset.pid) cur.captains[t] = ''; }); })) toast('Player removed');
    }); break;
    case 'addPlayer': {
      const name = ($('#newName').value || '').trim(); if(!name){ toast('Enter a name'); break; }
      const team = $('#newTeam').value;
      if(await mutate(cur => { cur.players.push({ id:uid(), name, team }); })){ toast(name + ' added'); }
      break;
    }
    case 'setNext': { const v = $('#nextDate').value; if(!v){ toast('Pick a date'); break; } if(!isMonday(v)){ toast('Games are on Mondays — pick a Monday'); break; } if(await mutate(cur => { cur.nextMatch = v; })) toast('Next match date saved'); break; }
    case 'clearNext': if(await mutate(cur => { cur.nextMatch = ''; })) toast('Date cleared'); break;
    case 'setTarget': { const n = parseInt($('#targetIn').value, 10); if(!(n >= 1 && n <= 50)){ toast('Enter a number from 1 to 50'); break; } if(await mutate(cur => { cur.target = n; })) toast('Saved'); break; }
    case 'addFine': {
      if(!finePid){ toast('Pick a player first'); break; }
      const kind = b.dataset.kind, src = (kind === 'reward' ? league.fines.rewards : league.fines.types).find(t => t.id === b.dataset.id); if(!src) break;
      await addEntry(finePid, src.name, kind === 'reward' ? -src.amount : src.amount); break;
    }
    case 'addCustom': {
      if(!finePid){ toast('Pick a player first'); break; }
      const amt = parseFloat($('#fCustAmt').value); if(!(amt > 0)){ toast('Enter an amount'); break; }
      const kind = b.dataset.kind, lab = ($('#fCustName').value || '').trim() || (kind === 'reward' ? 'Reward' : 'Fine');
      if(await addEntry(finePid, lab, kind === 'reward' ? -amt : amt)){ $('#fCustName').value = ''; $('#fCustAmt').value = ''; } break;
    }
    case 'togglePaid': await mutate(cur => { const e = cur.fines.entries.find(x => x.id === b.dataset.id); if(e) e.paid = !e.paid; }); break;
    case 'payAll': await mutate(cur => { cur.fines.entries.forEach(e => { if(e.playerId === b.dataset.pid && (e.season || 1) === cur.fines.season && e.amount > 0) e.paid = true; }); }) && toast('Marked as paid'); break;
    case 'delEntry': askConfirm('Delete this fine?', async () => { await mutate(cur => { cur.fines.entries = cur.fines.entries.filter(x => x.id !== b.dataset.id); }); }); break;
    case 'seedFines': await mutate(cur => {
      if(!cur.fines.types.length) cur.fines.types = STD_FINES.map(x => ({ id:uid(), name:x[0], amount:x[1] }));
      if(!cur.fines.rewards.length) cur.fines.rewards = STD_REWARDS.map(x => ({ id:uid(), name:x[0], amount:x[1] }));
    }) && toast('Fines added'); break;
    case 'addType': {
      const rw = b.dataset.kind === 'reward';
      const name = ($(rw ? '#rName' : '#tName').value || '').trim(), amt = parseFloat($(rw ? '#rAmt' : '#tAmt').value);
      if(!name || !(amt > 0)){ toast('Enter a name and amount'); break; }
      if(await mutate(cur => { (rw ? cur.fines.rewards : cur.fines.types).push({ id:uid(), name, amount:amt }); })) toast('Added'); break;
    }
    case 'delType': { const rw = b.dataset.kind === 'reward';
      await mutate(cur => { const k = rw ? 'rewards' : 'types'; cur.fines[k] = cur.fines[k].filter(t => t.id !== b.dataset.id); }); break; }
    case 'newSeason': askConfirm('Start a new fines season from £0? The old season is no longer shown.', async () => {
      if(await mutate(cur => { cur.fines.season = (cur.fines.season || 1) + 1; })) toast('New season started'); }); break;
    case 'newSeries': askConfirm('Start a new series from 0–0? The current one moves to "Previous series".', async () => {
      if(await mutate(cur => {
        cur.seriesMeta[cur.seriesNo] = { reds:capName(cur, 'reds'), whites:capName(cur, 'whites') };
        cur.captains = { reds:'', whites:'' };
        cur.seriesNo = (cur.seriesNo || 1) + 1; })){ form = newForm(); toast('New series started'); }
    }); break;
  }
});
document.addEventListener('change', e => {
  if(e.target.id === 'meSelect'){ try{ localStorage.setItem(LS_ME, e.target.value); }catch(err){} renderAvail(); }
  if(e.target.id === 'fDate'){ form.date = e.target.value; }
  if(e.target.id === 'fPlayer'){ finePid = e.target.value; }
  if(e.target.id === 'feeDate'){ feeDate = e.target.value || lastMonday(); renderAdmin(true); }
  if(e.target.id === 'finDate'){ finDate = e.target.value || todayStr(); }
  if(e.target.id === 'fineDate'){ fineDate = e.target.value || todayStr(); }
});
document.addEventListener('toggle', e => {
  const d = e.target; if(d.tagName === 'DETAILS' && d.dataset.key) adminOpen[d.dataset.key] = d.open;
  if(d.tagName === 'DETAILS' && d.dataset.fkey) fineOpen[d.dataset.fkey] = d.open;
}, true);
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'loginPin') doLogin(); });
document.addEventListener('focusout', () => { setTimeout(() => {
  const ae = document.activeElement;
  if(pendingAdminRender && !(ae && $('#adminBody').contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT'))) renderAdmin(true);
  if(pendingFinesRender && !(ae && $('#finesBody').contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT'))) renderFines(true);
}, 50); });

function showTab(t){
  currentTab = t;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + t));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  window.scrollTo(0, 0);
}

async function doLogin(){
  const pin = ($('#loginPin').value || '').trim();
  const err = $('#loginErr');
  if(!pin){ err.textContent = 'Enter the PIN'; return; }
  let hex = '';
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('bbtnf:' + pin));
    hex = Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
  }catch(e){ err.textContent = 'Could not check the PIN here'; return; }
  if(hex !== EDITOR_PIN_HASH){ err.textContent = 'Wrong PIN'; return; }
  user = { editor:true };
  try{ localStorage.setItem(LS_EDITOR, '1'); }catch(e){}
  renderAvail(); renderFines(true); renderAdmin(true);
}

/* ================= Firebase wiring ================= */
function watchAvailability(){
  if(!db) return;
  const want = {};
  if(league){
    if(!availDate){ availDate = nextDate(); calMonth = availDate.slice(0, 7); }
    want[nextDate()] = 1; want[availDate] = 1;
  }
  Object.keys(unsubs).forEach(d => { if(!want[d]){ unsubs[d](); delete unsubs[d]; delete availBy[d]; } });
  Object.keys(want).forEach(d => {
    if(unsubs[d]) return;
    unsubs[d] = db.collection('availability').doc(d).onSnapshot(s => {
      availBy[d] = s.exists ? (s.data().responses || {}) : {};
      renderAvail(); renderHome();
    }, err => { console.error(err); });
  });
  renderAvail(); renderHome();
}

function start(){
  renderAll();
  if(typeof firebase === 'undefined'){ showBanner('Could not load — check your connection', true); return; }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ console.error(e); showBanner('Could not connect', true); return; }


  db.collection('league').doc('main').onSnapshot(s => {
    loaded = true;
    league = s.exists ? normalize(s.data()) : null;
    if(league){ try{ localStorage.setItem(LS_CACHE, JSON.stringify(league)); }catch(e){} }
    hideBanner();
    renderAll();
    watchAvailability();
  }, err => {
    console.error(err);
    showBanner(league ? 'Offline — showing the last saved view' : 'Could not load — check your connection', true);
  });
}
start();
</script>
