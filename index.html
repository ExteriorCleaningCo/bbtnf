<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BBTNF">
<meta name="theme-color" content="#1A1A1A">
<style>
  :root{
    --red:#111111; --red-dark:#000000; --red-soft:#EDEDED;
    --ink:#1A1A1A; --paper:#F7F5F0; --card:#FFFFFF; --line:#E6E2D8; --muted:#6B6B66;
    --green:#111111; --green-soft:#EDEDED; --amber:#CFCFCF; --amber-soft:#EEEEEE;
    --radius:16px; --shadow:0 2px 10px rgba(26,26,26,.07);
    --display:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'SF Mono',Menlo,Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
  button,input,select{font-family:inherit;font-size:16px}
  button{cursor:pointer}
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

  header.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
  header.top img{width:42px;height:42px;flex:0 0 42px}
  header.top .t1{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.3px;line-height:1.1}
  header.top .t2{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#C9C9C2;margin-top:3px}

  #banner{display:none;background:var(--amber);color:var(--ink);font-size:13px;font-weight:500;text-align:center;padding:8px 12px}
  #banner.bad{background:var(--red);color:#fff}

  main{flex:1;padding:16px 16px 28px;width:100%;max-width:640px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}

  nav.tabs{position:sticky;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
    gap:2px;padding:7px 0;color:var(--muted);font-size:11px;font-weight:500;border-radius:10px}
  nav.tabs button .ic{font-size:19px;line-height:1}
  nav.tabs button{position:relative}
  nav.tabs .bdg{position:absolute;top:2px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-weight:600;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  body.gating #app{display:none}
  #gate{display:none}
  body.gating #gate{display:flex;min-height:100vh;min-height:100dvh;background:#000;color:#fff;align-items:center;justify-content:center;padding:28px 22px;text-align:center}
  .ginner{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}
  .ginner img{width:120px;height:120px}
  .ginner img.gsm{width:64px;height:64px;margin-bottom:10px}
  .gname{font-family:var(--display);font-weight:500;letter-spacing:8px;font-size:34px;margin:22px 0 34px;padding-left:8px}
  .gtitle{font-family:var(--display);font-weight:500;letter-spacing:2px;font-size:22px;margin-bottom:14px;text-transform:uppercase}
  #gate .btn.gbtn{background:#fff;color:#000}
  .gbtn{min-width:200px;margin-top:10px;font-size:17px;padding:14px 28px}
  .gnames{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}
  .gname-b{background:#fff;color:#000;border:none;border-radius:22px;padding:11px 16px;font-size:15px;font-weight:600}
  .gname-b span{color:#1B8A3E}
  .gnote{color:#bbb;font-size:13px;margin:14px 0 6px;line-height:1.4}
  .glinks{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  #gate .linkbtn{color:#fff;opacity:.8}
  .gin{width:100%;max-width:240px;text-align:center;letter-spacing:10px;font-size:24px;padding:12px;margin:8px 0;border-radius:12px;border:1.5px solid #444;background:#111;color:#fff}
  #gate .err{color:#ff7a7a;min-height:20px}
  nav.tabs button.active{color:var(--red)}

  h2{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.4px;margin:0}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .section-title{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}

  /* hero */
  .hero{background:#fff;color:var(--ink);border-radius:20px;padding:18px 14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .hero-label{text-align:center;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .hero-score{display:flex;align-items:stretch;justify-content:center;gap:10px;margin:14px 0 12px}
  .side{flex:1;border-radius:14px;padding:12px 6px;text-align:center}
  .side.reds{background:#C8102E;color:#fff}
  .side.whites{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  .side-name{font-size:12px;font-weight:600;letter-spacing:1.5px}
  .side-num{font-family:var(--mono);font-weight:500;font-size:52px;line-height:1.05;font-variant-numeric:tabular-nums}
  .vs{align-self:center;font-weight:500;color:var(--muted);font-size:14px}
  .pips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:7px}
  .pips i{width:12px;height:12px;border-radius:50%;border:2px solid #CFCFCF}
  .pips.reds i.on{background:#C8102E;border-color:#C8102E}
  .pips.whites i.on{background:#8C8C8C;border-color:#8C8C8C}
  .hero-note{text-align:center;font-size:13px;margin-top:12px;color:var(--ink)}
  .hero.done .hero-note{font-weight:600;color:var(--ink);font-size:15px}

  /* match cards */
  .match{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
  .m-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
  .m-score{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 8px;font-weight:600}
  .m-score .num{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums}
  .m-score .dash{color:var(--muted)}
  .m-score .tn{font-size:13px;letter-spacing:.5px}
  .m-scorers{font-size:13.5px;line-height:1.5}
  .m-scorers b{font-weight:600}
  .m-scorers .r{color:#C8102E}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.4px}
  .badge.reds{background:#C8102E;color:#fff}
  .badge.whites{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .badge.draw{background:var(--line);color:var(--muted)}

  .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .chip.reds{background:#C8102E;color:#fff}
  .chip.whites{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .chip.none{background:var(--line);color:var(--muted)}

  details.fold{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:0 14px;margin-bottom:12px}
  details.fold>summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::before{content:'▸';color:var(--muted);font-size:12px;transition:transform .15s}
  details.fold[open]>summary::before{transform:rotate(90deg)}
  details.fold>.fold-body{padding-bottom:14px}
  details.fold .match{box-shadow:none;border:1px solid var(--line)}

  /* teams */
  .teams-grid{display:grid;grid-template-columns:1fr;gap:12px}
  .team{border-top:6px solid var(--ink)}
  .team.reds{background:#C8102E;color:#fff;border-top:none}
  .team.reds .muted,.team.reds .pgoals{color:rgba(255,255,255,.85)}
  .team.reds .prow{border-bottom-color:rgba(255,255,255,.28)}
  .team.whites{background:#fff;border:2px solid var(--ink)}
  .team-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px}
  .prow:last-child{border-bottom:none}
  .pname{font-weight:500}
  .pgoals{font-family:var(--mono);font-weight:500;font-size:14px}

  /* scorers */
  .seg{display:flex;background:#fff;border-radius:12px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
  .seg button{flex:1;border:none;background:none;padding:10px;font-weight:600;font-size:13px;color:var(--muted);border-radius:9px}
  .seg button.active{background:var(--ink);color:#fff}
  .srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:none}
  .rank{width:30px;text-align:center;font-family:var(--mono);font-weight:500;color:var(--muted);font-size:15px}
  .srow.top .rank{color:var(--red);font-size:20px}
  .sinfo{flex:1;min-width:0}
  .sname{font-weight:600;font-size:16px}
  .sbar{height:6px;border-radius:4px;background:var(--line);margin-top:7px}
  .sbar i{display:block;height:100%;border-radius:4px;background:var(--red)}
  .sgoals{font-family:var(--mono);font-weight:500;font-size:22px;min-width:34px;text-align:right}

  /* availability */
  .me-box{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .me-box label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .me-box select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-weight:500;background:#fff;color:var(--ink)}
  .ans{display:flex;gap:8px;margin-top:12px}
  .ans button{flex:1;padding:14px 4px;border-radius:12px;border:2px solid var(--line);font-weight:500;font-size:14px;background:#fff;color:var(--ink)}
  .ans button.in.sel{background:var(--green);color:#fff}
  .ans button.maybe.sel{background:var(--amber);color:var(--ink)}
  .ans button.out.sel{background:#fff;color:var(--ink);border-color:var(--ink);text-decoration:line-through}
  .sumrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .sum{flex:1;min-width:70px;text-align:center;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px 4px}
  .sum b{display:block;font-family:var(--mono);font-size:22px}
  .sum span{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:500}
  .arow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .arow:last-child{border-bottom:none}
  .pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--line);color:var(--muted)}
  .pill.in{background:var(--ink);color:#fff}
  .pill.maybe{background:var(--amber-soft);color:#333333}
  .pill.out{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .mini{display:flex;gap:5px}
  .mini button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:600}
  .mini button.sel.in{background:var(--green);color:#fff;border-color:var(--green)}
  .mini button.sel.maybe{background:var(--amber);border-color:var(--amber)}
  .mini button.sel.out{background:#fff;color:var(--ink);border-color:var(--ink);text-decoration:line-through}

  /* admin */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select.f{
    width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:12px;padding:13px 16px;font-weight:600;font-size:15px}
  .btn.red{background:var(--red)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.full{width:100%}
  .btn.sm{padding:9px 12px;font-size:13px}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row>.grow{flex:1;min-width:120px}
  .score-row{display:flex;gap:10px;margin-bottom:14px}
  .score-side{flex:1;border-radius:14px;padding:12px 6px;text-align:center}
  .score-side.reds{background:#C8102E;color:#fff}
  .score-side.whites{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  .score-side .nm{font-size:12px;font-weight:600;letter-spacing:1.4px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
  .stepper button{width:44px;height:44px;border-radius:50%;border:none;font-size:24px;font-weight:600;background:rgba(0,0,0,.14);color:inherit}
  .score-side.whites .stepper button{background:var(--line)}
  .stepper .v{font-family:var(--mono);font-size:30px;font-weight:500;min-width:36px;text-align:center}
  .gstep{display:flex;align-items:center;gap:6px}
  .gstep button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:600}
  .gstep .v{min-width:24px;text-align:center;font-family:var(--mono);font-weight:500;font-size:18px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:6px 6px 6px 12px;font-weight:500;font-size:13.5px}
  .tag button{border:none;background:var(--line);width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:600;line-height:1}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .warn{background:var(--amber-soft);color:#333333;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500;margin-bottom:12px}
  .err{color:var(--red-dark);font-size:13px;font-weight:500;min-height:18px;margin-top:8px}
  .editbar{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .adminrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  .adminrow:last-child{border-bottom:none}
  .tbtns{display:flex;gap:5px}
  .tbtns button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600}
  .tbtns button.sel.reds{background:#C8102E;color:#fff;border-color:#C8102E}
  .tbtns button.sel.whites{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  .tbtns button.sel.none{background:var(--line)}
  .linkbtn{background:none;border:none;color:var(--red-dark);font-weight:600;font-size:13px;padding:6px}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:500;
    font-size:13.5px;padding:10px 18px;border-radius:30px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
  #toast.show{opacity:1}
  #confirm{position:fixed;inset:0;background:rgba(26,26,26,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:24px}
  #confirm.open{display:flex}
  #confirm .box{background:#fff;border-radius:18px;padding:20px;max-width:340px;width:100%;text-align:center}
  #confirm p{margin:0 0 16px;font-size:15px;line-height:1.45}
  #confirm .row{flex-wrap:nowrap}
  #confirm .row button{flex:1}

  /* pub fines */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fchip{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-weight:500;font-size:13.5px;color:var(--ink);line-height:1.2}
  .fchip b{font-family:var(--mono);font-size:13px;white-space:nowrap}
  .fchip.rw{background:var(--green-soft);border-color:#CFCFCF;color:var(--green)}
  .fhero{background:var(--ink);color:#fff;border-radius:20px;padding:20px 14px 16px;margin-bottom:14px;text-align:center;box-shadow:var(--shadow)}
  .fhero .big{font-family:var(--mono);font-weight:500;font-size:46px;line-height:1.05;margin-top:6px}
  .pf{border-bottom:1px solid var(--line)}
  .pf:last-child{border-bottom:none}
  .pf>summary{list-style:none;cursor:pointer;padding:12px 0;display:block}
  .pf>summary::-webkit-details-marker{display:none}
  .pf-main{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .pf-amt{font-family:var(--mono);font-weight:500;font-size:17px}
  .pf-sub{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .pf-body{padding:2px 0 12px}
  .erow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
  .erow .el{flex:1;min-width:120px}
  .erow .ed{font-size:12px;color:var(--muted)}
  .erow .ea{font-family:var(--mono);font-weight:500}
  .pos{color:#1B8A4B}
  .neg{color:#C8102E}
  .fhero .pos{color:#4ADE80}
  .fhero .neg{color:#FF7B7B}
  .paidbtn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600}
  .paidbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
  nav.tabs button{font-size:9.5px;letter-spacing:-.1px;padding-left:0;padding-right:0;min-width:0}
  header.top .t1{font-weight:500;letter-spacing:4px;font-size:20px}

  b,strong{font-weight:600}
  h2{font-weight:600}
  .side-num,.fhero .big,.stepper .v{font-weight:300}
  .fhero .hero-label{color:#C9C9C2}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;color:var(--ink)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-h{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.6px;padding:4px 0}
  .cal-d{height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;position:relative}
  .cal-d.off{color:#C4C1B8}
  .cal-d.mon{border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:500}
  .cal-d.mon.sel{background:var(--ink);color:#fff}
  .cal-d.mon.nx::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:currentColor}
  .cal-d.today{text-decoration:underline}
  .teamsrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tcol{padding:14px 12px;margin-bottom:0;min-width:0}
  .tcol.reds{background:#C8102E;color:#fff}
  .tcol.whites{border:2px solid var(--ink)}
  .tc-head{font-size:12px;letter-spacing:1.5px;font-weight:600}
  .tc-cap{margin:8px 0 10px;padding:8px;border-radius:10px;background:rgba(128,128,128,.2)}
  .tc-cap span{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
  .tc-cap b{font-size:16px}
  .tc-g{font-family:var(--mono);font-size:13px;opacity:.9;white-space:nowrap}
  .tc-p{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;font-size:14.5px;border-top:1px solid rgba(128,128,128,.3)}
  .hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hubbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 14px;min-height:112px;color:var(--ink);min-width:0}
  .hubbtn .hi{font-size:26px;line-height:1;margin-bottom:6px}
  .hubbtn b{font-size:15.5px}
  .hubbtn .hs{font-size:12.5px;color:var(--muted)}
  .cbtn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:500;color:var(--ink)}
  .cbtn.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cbadge{display:inline-block;font-size:10px;font-weight:600;border:1.5px solid currentColor;border-radius:50%;width:19px;height:19px;line-height:16px;text-align:center;margin-left:6px;vertical-align:middle}
  .finrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .finrow.total{border-bottom:none;font-weight:600;font-size:17px;padding-top:12px}
  .finrow span:last-child{font-family:var(--mono)}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function dayOf(s){ return new Date(s + 'T12:00:00'); }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function isMonday(s){ return !!s && dayOf(s).getDay() === 1; }
function defaultWeekDate(){
  const dow = new Date().getDay();            // Mon = tonight's game, Tue/Wed = last night's, otherwise the coming Monday
  return (dow === 1 || dow === 2 || dow === 3) ? lastMonday() : upcomingMonday();
}
function upcomingMonday(){ const d = new Date(); d.setHours(12,0,0,0); while(d.getDay() !== 1) d.setDate(d.getDate() + 1); return ymd(d); }
function lastMonday(){ const d = new Date(); d.setHours(12,0,0,0); while(d.getDay() !== 1) d.setDate(d.getDate() - 1); return ymd(d); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDate(s, long){
  if(!s) return '';
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('en-GB', long
    ? {weekday:'long', day:'numeric', month:'long', year:'numeric'}
    : {weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ================= data ================= */
function defaultFines(){ return { season:1, players:[], types:[], rewards:[], entries:[] }; }
function defaultLeague(){ return { name:'BBTNF Reds v Whites', target:10, seriesNo:1, players:[], matches:[], nextMatch:'', seriesName:'', fines:defaultFines(), captains:{reds:'',whites:''}, seriesMeta:{}, history:[], weeks:{}, fee:5, finance:{opening:0,entries:[]}, members:{}, autoNotify:true, voting:{open:false,cats:[],voted:{},ballots:[]} }; }
function normalize(d){
  const o = Object.assign(defaultLeague(), d || {});
  o.players = o.players || []; o.matches = o.matches || [];
  o.target = Number(o.target) || 10; o.seriesNo = Number(o.seriesNo) || 1;
  const f = Object.assign(defaultFines(), o.fines || {});
  f.players = f.players || []; f.types = f.types || []; f.rewards = f.rewards || []; f.entries = f.entries || []; f.season = Number(f.season) || 1;
  o.fines = f;
  o.captains = Object.assign({ reds:'', whites:'' }, o.captains || {});
  o.seriesName = String(o.seriesName || '');
  o.members = (o.members && typeof o.members === 'object') ? o.members : {};
  o.autoNotify = o.autoNotify !== false;
  const vt = Object.assign({ open:false, cats:[], voted:{}, ballots:[] }, o.voting || {});
  vt.cats = vt.cats || []; vt.voted = vt.voted || {}; vt.ballots = vt.ballots || []; o.voting = vt;
  o.seriesMeta = o.seriesMeta || {}; o.weeks = o.weeks || {}; o.history = o.history || [];
  o.fee = (o.fee === undefined || o.fee === null || isNaN(Number(o.fee))) ? 5 : Number(o.fee);
  const fin = Object.assign({ opening:0, entries:[] }, o.finance || {});
  fin.entries = fin.entries || []; fin.opening = Number(fin.opening) || 0; o.finance = fin;
  return o;
}

/* ---- series maths ---- */
function matchesOf(n){ return (league ? league.matches : []).filter(m => (m.seriesNo || 1) === n); }
function sortedMatches(n){ return matchesOf(n).slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')); }
function seriesLabel(n){
  if(!league) return 'Series ' + n;
  const nm = (n === league.seriesNo) ? league.seriesName : ((league.seriesMeta[n] || {}).name || '');
  return nm || ('Series ' + n);
}
function seriesState(n){
  let r = 0, w = 0;
  matchesOf(n).forEach(m => { if(m.reds > m.whites) r++; else if(m.whites > m.reds) w++; });
  const target = league.target;
  const complete = r >= target || w >= target;
  const winner = complete ? (r > w ? 'reds' : (w > r ? 'whites' : null)) : null;
  return { r, w, complete, winner };
}
function goalsMap(seriesNo, year){
  const map = {};
  (league ? league.matches : []).forEach(m => {
    if(seriesNo != null && (m.seriesNo || 1) !== seriesNo) return;
    if(year && (m.date || '').slice(0, 4) !== String(year)) return;
    (m.scorers || []).forEach(s => {
      const k = s.playerId;
      if(!map[k]) map[k] = { playerId:k, name:s.name, team:s.team, goals:0 };
      map[k].goals += Number(s.goals) || 0;
    });
  });
  Object.values(map).forEach(x => {
    const p = league.players.find(p => p.id === x.playerId);
    if(p){ x.name = p.name; x.team = p.team || x.team; }
  });
  return map;
}

/* ---- writes ---- */
async function mutate(fn){
  if(!db){ toast('Not connected'); return false; }
  const ref = db.collection('league').doc('main');
  try{
    await db.runTransaction(async t => {
      const s = await t.get(ref);
      const cur = s.exists ? normalize(s.data()) : defaultLeague();
      lastAbort = false;
      if(fn(cur) === 'abort'){ lastAbort = true; return; }
      t.set(ref, cur);
    });
    return !lastAbort;
  }catch(e){
    console.error(e);
    if(e && e.code === 'permission-denied') toast("Couldn't save — check the Firebase rules");
    else toast("Couldn't save — check your connection");
    return false;
  }
}
function nextDate(){ return (league && league.nextMatch) ? league.nextMatch : upcomingMonday(); }
async function setAvailability(pid, status){
  const date = availDate || nextDate();
  if(!db || !league || !date){ return; }
  try{
    await db.collection('availability').doc(date).set({ responses:{ [pid]:{ s:status, t:Date.now() } } }, { merge:true });
  }catch(e){ console.error(e); toast("Couldn't save — check your connection"); }
}

/* ================= rendering ================= */
function emptyLeague(){
  return '<div class="card empty"><b>Nothing here yet</b>The league hasn\'t been set up. An admin can do this from the Admin tab.</div>';
}
function teamChip(t){
  return t === 'reds' ? '<span class="chip reds">Reds</span>' : (t === 'whites' ? '<span class="chip whites">Whites</span>' : '<span class="chip none">No team</span>');
}
function pips(count, target, cls){
  let h = '';
  for(let i = 0; i < Math.max(target, count); i++) h += '<i class="' + (i < count ? 'on' : '') + '"></i>';
  return '<div class="pips ' + cls + '">' + h + '</div>';
}
function scorerLine(m, team){
  const list = (m.scorers || []).filter(s => s.team === team);
  if(!list.length) return '';
  const txt = list.map(s => esc(s.name) + (s.goals > 1 ? ' ' + s.goals : '')).join(', ');
  return '<div class="m-scorers"><b class="' + (team === 'reds' ? 'r' : '') + '">' + (team === 'reds' ? 'Reds' : 'Whites') + ':</b> ' + txt + '</div>';
}
function matchCard(m){
  const badge = m.reds > m.whites ? '<span class="badge reds">Reds win</span>' : (m.whites > m.reds ? '<span class="badge whites">Whites win</span>' : '<span class="badge draw">Draw</span>');
  const un = (m.scorers || []).filter(s => s.team !== 'reds' && s.team !== 'whites');
  const unTxt = un.length ? '<div class="m-scorers"><b>Other:</b> ' + un.map(s => esc(s.name) + (s.goals > 1 ? ' ' + s.goals : '')).join(', ') + '</div>' : '';
  return '<div class="match"><div class="m-top"><span>' + esc(fmtDate(m.date)) + '</span>' + badge + '</div>' +
    '<div class="m-score"><span class="tn">REDS</span><span class="num">' + m.reds + '</span><span class="dash">–</span><span class="num">' + m.whites + '</span><span class="tn">WHITES</span></div>' +
    scorerLine(m, 'reds') + scorerLine(m, 'whites') + unTxt + '</div>';
}

function capName(l, team){ const p = l.players.find(p => p.id === l.captains[team]); return p ? p.name : ''; }
function teamsCaptainsHtml(){
  if(!league.players.some(p => p.team === 'reds' || p.team === 'whites')) return '';
  const g = goalsMap(league.seriesNo);
  const col = team => {
    const ps = league.players.filter(p => p.team === team).sort(byName), cap = capName(league, team);
    return '<div class="card tcol ' + team + '"><div class="tc-head">' + (team === 'reds' ? 'REDS' : 'WHITES') + '</div>' +
      '<div class="tc-cap"><span>Captain</span><b>' + (cap ? esc(cap) : '—') + '</b></div>' +
      (ps.length ? ps.map(p => '<div class="tc-p"><span>' + esc(p.name) + (league.captains[team] === p.id ? '<span class="cbadge">C</span>' : '') + '</span>' + (g[p.id] ? '<span class="tc-g">⚽ ' + g[p.id].goals + '</span>' : '') + '</div>').join('') : '<div class="small" style="opacity:.7">No players yet</div>') + '</div>';
  };
  return '<div class="section-title">Teams · ' + esc(seriesLabel(league.seriesNo)) + '</div><div class="teamsrow">' + col('reds') + col('whites') + '</div>';
}
function renderHome(){
  const el = $('#homeBody');
  if(!league){ el.innerHTML = loaded ? emptyLeague() : '<div class="empty">Loading…</div>'; return; }
  const n = league.seriesNo, st = seriesState(n), target = league.target;
  let note;
  if(st.complete){
    note = st.winner ? '🏆 ' + (st.winner === 'reds' ? 'Reds' : 'Whites') + ' win the series ' + Math.max(st.r, st.w) + '–' + Math.min(st.r, st.w) + '!' : 'Series finished level';
  } else {
    note = 'First to ' + target + ' wins · Reds need ' + (target - st.r) + ' · Whites need ' + (target - st.w);
  }
  let h = '<div class="hero ' + (st.complete ? 'done' : '') + '"><div class="hero-label">' + esc(seriesLabel(n)) + ' · First to ' + target + '</div>' +
    '<div class="hero-score"><div class="side reds"><div class="side-name">REDS</div><div class="side-num">' + st.r + '</div></div>' +
    '<div class="vs">v</div><div class="side whites"><div class="side-name">WHITES</div><div class="side-num">' + st.w + '</div></div></div>' +
    pips(st.r, target, 'reds') + pips(st.w, target, 'whites') + '<div class="hero-note">' + esc(note) + '</div></div>';


  if(!st.complete){
    const c = availCounts(nextDate());
    h += '<div class="card"><div class="row" style="justify-content:space-between"><div><div class="muted small" style="font-weight:600;letter-spacing:.8px;text-transform:uppercase">Next match</div>' +
      '<div style="font-weight:600;font-size:17px;margin-top:2px">' + esc(fmtDate(nextDate(), true)) + '</div>' +
      '<div class="small muted" style="margin-top:4px">' + c.in + ' in · ' + c.maybe + ' maybe · ' + c.out + ' out</div></div>' +
      '<button class="btn red sm" data-tab="avail">Reply</button></div></div>';
  }

  const tn = weekRows(nextDate()), tk = Object.keys(tn);
  if(tk.length && !st.complete){
    const tcol = team => '<div class="card tcol ' + team + '"><div class="tc-head">' + (team === 'reds' ? 'REDS' : 'WHITES') + '</div>' +
      tk.filter(k => tn[k].t === team).sort((a, b) => tn[a].n.localeCompare(tn[b].n)).map(k => '<div class="tc-p"><span>' + esc(tn[k].n) + '</span></div>').join('') + '</div>';
    h += '<div class="section-title">Teams for ' + esc(fmtDate(nextDate())) + '</div><div class="teamsrow">' + tcol('reds') + tcol('whites') + '</div>';
  }
  const ms = sortedMatches(n);
  h += '<div class="section-title">Results this series</div>';
  h += ms.length ? ms.map(matchCard).join('') : '<div class="card empty"><b>No matches yet</b>Results will appear here after each game.</div>';

  const past = [];
  for(let i = n - 1; i >= 1; i--) if(matchesOf(i).length) past.push(i);
  if(past.length || league.history.length){
    h += '<div class="section-title">Previous series</div>';
    past.forEach(i => {
      const s = seriesState(i);
      const label = s.winner ? (s.winner === 'reds' ? 'Reds' : 'Whites') + ' won ' + Math.max(s.r, s.w) + '–' + Math.min(s.r, s.w) : 'Finished ' + s.r + '–' + s.w;
      const meta = league.seriesMeta[i] || {};
      const capLine = (meta.reds || meta.whites) ? '<div class="muted small" style="margin-bottom:10px">Captains · Reds: ' + esc(meta.reds || '—') + ' · Whites: ' + esc(meta.whites || '—') + '</div>' : '';
      h += '<details class="fold"><summary>' + esc(seriesLabel(i)) + ' · ' + esc(label) + '</summary><div class="fold-body">' + capLine + sortedMatches(i).map(matchCard).join('') + '</div></details>';
    });
    league.history.forEach(x => {
      const badge = x.reds > x.whites ? '<span class="badge reds">Reds won</span>' : (x.whites > x.reds ? '<span class="badge whites">Whites won</span>' : '<span class="badge draw">Level</span>');
      h += '<div class="match"><div class="m-top"><span>' + esc(x.label) + '</span>' + badge + '</div><div class="m-score"><span class="tn">REDS</span><span class="num">' + x.reds + '</span><span class="dash">–</span><span class="num">' + x.whites + '</span><span class="tn">WHITES</span></div></div>';
    });
  }
  el.innerHTML = h;
}

function renderTeams(){
  const el = $('#teamsBody');
  if(!league){ el.innerHTML = loaded ? emptyLeague() : '<div class="empty">Loading…</div>'; return; }
  let h = teamsCaptainsHtml();
  if(!h) h = '<div class="card empty"><b>No teams yet</b>Teams and captains will show here once an admin picks them.</div>';
  const un = league.players.filter(p => p.team !== 'reds' && p.team !== 'whites').sort(byName);
  if(un.length) h += '<div class="section-title">Floaters</div><div class="card">' + un.map(p => '<div class="prow"><span class="pname">' + esc(p.name) + '</span></div>').join('') + '</div>';
  h += '<div class="muted small" style="text-align:center">⚽ = goals this series</div>';
  el.innerHTML = h;

let statScope = 'year';
function statsHtml(){
  const yr = voteYear(), sn = league.seriesNo;
  const ms = league.matches.filter(m => statScope === 'series' ? (m.seriesNo || 1) === sn : (m.date || '').slice(0, 4) === String(yr));
  const st = {}, noTeams = [];
  const get = pid => st[pid] || (st[pid] = { p:0, w:0, d:0, l:0, g:0 });
  ms.forEach(m => {
    const rows = rosterOf(m);
    if(!Object.keys(rows).length) noTeams.push(fmtDate(m.date));
    const win = m.reds > m.whites ? 'reds' : m.whites > m.reds ? 'whites' : 'draw';
    Object.keys(rows).forEach(pid => {
      const t = rows[pid];
      const x = get(pid); x.p++;
      if(win === 'draw') x.d++; else if(win === t) x.w++; else x.l++;
    });
    (m.scorers || []).forEach(sc => { get(sc.playerId).g += Number(sc.goals) || 0; });
  });
  const list = Object.keys(st).map(pid => { const pl = league.players.find(p => p.id === pid); const x = st[pid]; return Object.assign({ name: pl ? pl.name : '(removed)', pct: x.p ? Math.round(x.w / x.p * 100) : 0 }, x); })
    .sort((a,b) => b.pct - a.pct || b.p - a.p || b.g - a.g || a.name.localeCompare(b.name));
  let h = '<div class="seg" style="margin-bottom:12px"><button data-act="statscope" data-v="year" class="' + (statScope === 'year' ? 'active' : '') + '">' + yr + ' season</button><button data-act="statscope" data-v="series" class="' + (statScope === 'series' ? 'active' : '') + '">This series</button></div>';
  if(noTeams.length) h += '<div class="warn">⚠ No teams were picked for: ' + noTeams.map(esc).join(', ') + '. Players can\'t be counted for those results — use Pick teams for that date.</div>';
  if(!list.length) return h + '<div class="muted small">No stats yet. They build up from the teams you pick each week (Pick teams) and the results you add.</div>';
  const cols = 'display:grid;grid-template-columns:minmax(0,1fr) 26px 26px 26px 26px 42px 30px;gap:4px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;text-align:center';
  h += '<div style="' + cols + ';font-size:11px;font-weight:600;color:var(--muted)"><span style="text-align:left">Player</span><span>P</span><span>W</span><span>D</span><span>L</span><span>Win%</span><span>⚽</span></div>';
  h += list.map(x => '<div style="' + cols + '"><span style="text-align:left;font-weight:600;overflow-wrap:anywhere">' + esc(x.name) + '</span><span>' + x.p + '</span><span>' + x.w + '</span><span>' + x.d + '</span><span>' + x.l + '</span><b>' + x.pct + '%</b><span>' + x.g + '</span></div>').join('');
  h += '<div class="hint" style="margin-top:10px">P played · W won · D drawn · L lost · Win% of games played · ⚽ goals. Games come from the teams picked each week in Pick teams.</div>';
  return h;
}
let ballot = {};
function voteYear(){ return new Date().getFullYear(); }
function renderVoting(){
  const el = $('#votingBody'); if(!el) return;
  const title = voteYear() + ' BBTNF Awards Voting';
  if(!league){ el.innerHTML = loaded ? emptyLeague() : '<div class="empty">Loading…</div>'; return; }
  const vt = league.voting;
  if(!vt.open){ el.innerHTML = '<div class="card empty" style="padding:48px 16px"><b>' + title + '</b>Coming soon</div>'; return; }
  const me = meId();
  if(!me){ el.innerHTML = '<div class="card empty"><b>' + title + '</b>Sign in with your name to vote.<div style="margin-top:14px"><button class="btn red" data-act="openGate">Sign in</button></div></div>'; return; }
  if(vt.voted[me]){ el.innerHTML = '<div class="card empty" style="padding:40px 16px"><b>' + title + '</b>✅ Thanks, your vote is in. Votes are secret.</div>'; return; }
  if(!vt.cats.length){ el.innerHTML = '<div class="card empty"><b>' + title + '</b>Voting is open but no awards have been set up yet.</div>'; return; }
  const noms = league.players.filter(p => p.id !== me).sort(byName);
  let h = '<div class="card"><h2>' + title + '</h2><p class="muted small" style="margin:8px 0 0">One vote per person and it is secret. You can\'t vote for yourself and you can\'t change it once sent.</p></div>';
  h += vt.cats.map(c => '<div class="card"><div style="font-weight:600;margin-bottom:8px">' + esc(c.name) + '</div><select class="f vsel" data-cat="' + esc(c.id) + '"><option value="">No vote</option>' +
    noms.map(p => '<option value="' + esc(p.id) + '"' + (ballot[c.id] === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></div>').join('');
  h += '<button class="btn red full" data-act="castVote">Submit my vote</button>';
  el.innerHTML = h;
}
function votingAdminHtml(){
  const vt = league.voting, total = league.players.length, done = league.players.filter(p => vt.voted[p.id]);

}

async function autoAssign(){
  if(!user || !league || autoBusy || adminSection !== 'pick') return;

  const w = league.weeks[feeDate] || {}, rows = w.rows || {}, auto = w.auto || {};

  if(!ids.length) return;
  autoBusy = true;

  const ok = await mutate(cur => {

    cur.players.forEach(p => { if(ids.indexOf(p.id) >= 0 && !wk.rows[p.id] && !wk.auto[p.id]){ wk.rows[p.id] = { n:p.name, t:p.team, paid:false, amt:cur.fee }; wk.auto[p.id] = true; } });

}

const r2 = n => Math.round(n * 100) / 100;
const money = n => '£' + r2(n).toFixed(2);
const mh = (n, signed) => { n = r2(n); const c = n > 0 ? 'pos' : (n < 0 ? 'neg' : ''); return '<span class="' + c + '">' + (n < 0 ? '−' : (signed && n > 0 ? '+' : '')) + money(Math.abs(n)) + '</span>'; };
function curEntries(){ const f = league.fines; return f.entries.filter(e => (e.season || 1) === f.season); }

function fpRowsHtml(f){

function renderFines(force){

  if(!force && ae && el.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')){
    pendingFinesRender = true;
    if(league){
      const f2 = league.fines;
      [['#fpRows', fpRowsHtml(f2)], ['#tRows', typeRowsHtml(f2.types, 'fine')], ['#rRows', typeRowsHtml(f2.rewards, 'reward')]].forEach(x => { const n = $(x[0]); if(n && !n.contains(ae)) n.innerHTML = x[1]; });

    const k = e.playerId;
    if(!map[k]) map[k] = { id:k, name:e.name, fined:0, rew:0, coll:0, ents:[] };

  if(edit){

    if(f.types.length) h += '<div class="fgrid">' + f.types.map(t => '<button class="fchip" data-act="addFine" data-kind="fine" data-id="' + esc(t.id) + '"><span>' + esc(t.name) + '</span><b class="pos">' + money(t.amount) + '</b></button>').join('') + '</div>';
    else h += '<div class="hint">No fine types yet. Use "Fine and reward types" just below to add the standard list.</div>';
    if(f.rewards.length) h += '<div class="section-title" style="margin:16px 2px 8px">Rewards (take money off)</div><div class="fgrid">' + f.rewards.map(t => '<button class="fchip rw" data-act="addFine" data-kind="reward" data-id="' + esc(t.id) + '"><span>' + esc(t.name) + '</span><b class="neg">−' + money(t.amount) + '</b></button>').join('') + '</div>';
    h += '<div class="section-title" style="margin:16px 2px 8px">Something else</div><div class="row"><input type="text" id="fCustName" class="grow" placeholder="What for?" maxlength="40"><input type="number" id="fCustAmt" inputmode="decimal" step="0.5" min="0" placeholder="£" style="width:90px"></div>' +

  }

  if(edit){
    h += '<div class="section-title">Set up players and fine types</div>' +
      fpFold(f) + '<details class="fold" data-fkey="mgr"' + (fineOpen.mgr ? ' open' : '') + '><summary>Fine and reward types</summary><div class="fold-body">' +
      (!f.types.length && !f.rewards.length ? '<button class="btn red full" data-act="seedFines" style="margin-bottom:12px">Add the standard BBTNF fines and rewards</button>' : '') +
      '<div class="muted small" style="font-weight:600;margin-bottom:4px">FINES</div>' + '<div id="tRows">' + typeRowsHtml(f.types, 'fine') + '</div>' +
      '<div class="row" style="margin:10px 0 18px"><input type="text" id="tName" class="grow" placeholder="New fine" maxlength="40"><input type="number" id="tAmt" inputmode="decimal" step="0.5" min="0" placeholder="£" style="width:80px"><button class="btn sm" data-act="addType" data-kind="fine">Add</button></div>' +
      '<div class="muted small" style="font-weight:600;margin-bottom:4px">REWARDS</div>' + '<div id="rRows">' + typeRowsHtml(f.rewards, 'reward') + '</div>' +
      '<div class="row" style="margin-top:10px"><input type="text" id="rName" class="grow" placeholder="New reward" maxlength="40"><input type="number" id="rAmt" inputmode="decimal" step="0.5" min="0" placeholder="£" style="width:80px"><button class="btn sm" data-act="addType" data-kind="reward">Add</button></div></div></details>' +
      '<details class="fold" data-fkey="season"' + (fineOpen.season ? ' open' : '') + '><summary>New fines season</summary><div class="fold-body"><p class="muted small" style="margin:0 0 12px">Starts the fines list again from £0. The old season is kept safely in the database but is no longer shown.</p><button class="btn ghost full" data-act="newSeason">Start season ' + (f.season + 1) + '</button></div></details>';
  }
  h += '<div class="section-title">Players · % of pot</div><div class="card" style="padding:4px 16px">';
  h += rows.map(m => {
    const pct = tColl > 0 ? Math.round(m.coll / tColl * 100) : 0;
    const key = 'p:' + m.id;
    const list = m.ents.slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')).map(e =>
      '<div class="erow"><div class="el"><div>' + esc(e.label) + '</div><div class="ed">' + esc(fmtDate(e.date)) + '</div></div>' +
      '<span class="ea ' + (e.amount < 0 ? 'neg' : 'pos') + '">' + (e.amount < 0 ? '−' : '') + money(Math.abs(e.amount)) + '</span>' +
      (e.amount > 0 ? (edit ? '<button class="paidbtn' + (e.paid ? ' on' : '') + '" data-act="togglePaid" data-id="' + esc(e.id) + '">' + (e.paid ? 'Paid ✓' : 'Mark paid') + '</button>' : '<span class="pill' + (e.paid ? ' in' : '') + '">' + (e.paid ? 'Paid' : 'Owing') + '</span>') : '') +

    return '<details class="pf" data-fkey="' + esc(key) + '"' + (fineOpen[key] ? ' open' : '') + '><summary><div class="pf-main"><span class="pname">' + esc(m.name) + '</span><span class="pf-amt">' + mh(m.coll) + '</span></div>' +
      '<div class="sbar"><i style="width:' + pct + '%"></i></div><div class="pf-sub"><span>' + pct + '% of pot</span><span>' + (m.owing > 0 ? 'Owes ' + mh(m.owing) : 'All paid') + '</span></div></summary>' +
      '<div class="pf-body">' + (list || '<div class="muted small">No fines yet.</div>') +
      (edit && m.owing > 0 ? '<button class="btn ghost sm full" style="margin-top:10px" data-act="payAll" data-pid="' + esc(m.id) + '">Mark everything paid (' + money(m.owing) + ')</button>' : '') + '</div></details>';
  }).join('') || '<div class="empty">No players yet.</div>';

async function addEntry(pid, label, amount){
  const p = league.fines.players.find(p => p.id === pid); if(!p) return false;
  const date = fineDate || todayStr();
  const ok = await mutate(cur => { cur.fines.entries.push({ id:uid(), season:cur.fines.season, date, playerId:pid, name:p.name, label, amount:r2(amount), paid:false }); });
  if(ok) toast(p.name + ': ' + label + ' ' + (amount < 0 ? '−' : '') + money(Math.abs(amount)));
  return ok;
}
async function saveMatch(){
  if(!form.date){ toast('Pick a date'); return; }
  const editing = !!form.id;
  if(!editing && seriesState(league.seriesNo).complete){ toast('Series finished — start a new one first'); return; }
  const m = { id:form.id || uid(), seriesNo:form.seriesNo || league.seriesNo, date:form.date, reds:form.reds, whites:form.whites, scorers:form.scorers.map(s => Object.assign({}, s)) };
  let hadTeams = true;
  const ok = await mutate(cur => {
    const old = editing ? cur.matches.find(x => x.id === m.id) : null;
    const rows = ((cur.weeks[m.date] || {}).rows) || {}, ro = {};
    Object.keys(rows).forEach(k => { if(rows[k].t === 'reds' || rows[k].t === 'whites') ro[k] = rows[k].t; });
    hadTeams = Object.keys(ro).length > 0;
    if(hadTeams) m.roster = ro; else if(old && old.roster) m.roster = old.roster; else delete m.roster;
    if(editing){ const i = cur.matches.findIndex(x => x.id === m.id); if(i >= 0) cur.matches[i] = m; else cur.matches.push(m); }
    else { m.seriesNo = cur.seriesNo; cur.matches.push(m); }
  });
  if(ok && !editing && league && league.autoNotify){
    const ro = rosterOf({ date:m.date }), win = m.reds > m.whites ? 'reds' : m.whites > m.reds ? 'whites' : 'draw';
    const title = 'Full time: Reds ' + m.reds + ' – ' + m.whites + ' Whites';
    const ids = f => Object.keys(ro).filter(k => f(ro[k]));

async function enablePush(){
  const me = meId(); if(!me){ toast('Sign in with your name first'); return; }
  if(!pushSupported()){ toast(isIOS() && !isStandalone() ? 'On iPhone, add BBTNF to your Home Screen first' : "This browser can't do notifications"); return; }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Notifications are blocked. Allow them in your phone settings.'); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const ok = await mutate(cur => {
      const m = cur.members[me]; if(!m) return 'abort';
      m.push = (m.push || []).filter(x => x.endpoint !== j.endpoint); m.push.push({ endpoint:j.endpoint, keys:j.keys });
    });
    if(ok) toast('Notifications are on 🔔');
  }catch(e){ console.error(e); toast("Couldn't turn on notifications here"); }
  refreshPushState();
}
async function disablePush(){
  const me = meId(); if(!me) return;
  try{
    const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
    const ep = sub ? sub.endpoint : '';
    if(sub) await sub.unsubscribe();
    await mutate(cur => { const m = cur.members[me]; if(m) m.push = (m.push || []).filter(x => x.endpoint !== ep); });
    toast('Notifications off');
  }catch(e){ console.error(e); }
  refreshPushState();
}
async function sendPush(messages){
  if(!user || !league) return null;
  const me = meId(); let auth = null;
  if(me && league.members[me].admin) auth = { pid:me, pin:league.members[me].pin };
  else { let code = ''; try{ code = localStorage.getItem(LS_ORG) || ''; }catch(e){} if(organiser && code) auth = { code:code }; }
  if(!auth){ toast('Sign out, then sign in with the organiser code again to send notifications'); return null; }
  try{
    const r = await fetch('/api/notify', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ auth:auth, messages:messages }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok){ toast(j.error || "Couldn't send notifications"); return null; }
    return j;
  }catch(e){ toast("Couldn't send notifications"); return null; }
}
function sentToast(j){ if(j) toast(j.devices ? 'Sent to ' + j.sent + (j.sent === 1 ? ' phone' : ' phones') : 'Nobody has notifications turned on yet'); }
function footHtml(){
  const me = meId(), mp = me && league ? league.players.find(p => p.id === me) : null;
  let h = (mp || organiser)
    ? '<span class="muted small">Signed in as ' + esc(mp ? mp.name : 'Organiser') + '</span> <button class="linkbtn" data-act="logout">Sign out</button>'
    : '<button class="linkbtn" data-act="openGate">Sign in with your name</button>';
  if(mp){
    if(!pushSupported()) h += '<div class="hint" style="margin-top:12px">' + (isIOS() && !isStandalone() ? 'To get notifications on iPhone: tap Share, then Add to Home Screen, then open BBTNF from your home screen.' : 'Notifications are not supported on this browser.') + '</div>';
    else if(pushOn) h += '<div style="margin-top:12px"><span class="muted small">🔔 Notifications are on</span> <button class="linkbtn" data-act="disablePush">Turn off</button></div>';
    else h += '<div style="margin-top:12px"><button class="btn sm" data-act="enablePush">🔔 Turn on notifications</button></div>';
  }
  return h;
}
function notifyHtml(){
  const mem = league.members, ps = league.players.slice().sort(byName);
  const on = ps.filter(p => mem[p.id] && (mem[p.id].push || []).length), off = ps.filter(p => !(mem[p.id] && (mem[p.id].push || []).length));
  let h = '<div class="hint" style="margin-bottom:12px">' + on.length + ' of ' + ps.length + ' players have notifications on.' + (off.length ? ' Not on yet: ' + off.map(p => esc(p.name)).join(', ') + '.' : '') +
    ' Each person turns them on by tapping "Turn on notifications" at the bottom of the Home tab (iPhone: add BBTNF to the Home Screen first).</div>' +
    '<div class="field"><label>Teams</label><button class="btn full" data-act="notifyTeams">Tell players their team for ' + esc(fmtDate(feeDate)) + '</button></div>' +
    '<div class="field"><label>Availability</label><button class="btn ghost full" data-act="notifyNudge">Nudge people who haven\'t replied for ' + esc(fmtDate(nextDate())) + '</button></div>' +
    '<div class="field"><label for="notifText">Your own message to everyone</label><div class="row"><input type="text" id="notifText" class="grow" placeholder="e.g. Pitch changed to pitch 3" maxlength="120"><button class="btn sm" data-act="notifyCustom">Send</button></div></div>' +
    '<div class="field"><label>Automatic notifications</label><button class="btn ' + (league.autoNotify ? 'ghost' : 'red') + ' full" data-act="toggleAuto">' + (league.autoNotify ? 'On: results and voting are sent automatically (tap to turn off)' : 'Off (tap to turn on)') + '</button></div>';
  return h;
}
function gateErr(msg){ const e = $('#gateErr'); if(e) e.textContent = msg; }
function saveSess(pid, pin){ try{ localStorage.setItem(LS_SESS, JSON.stringify({ pid:pid, pin:pin })); }catch(e){} }
function finishSignIn(){ gateOpen = false; gateStep = 'splash'; applyAuthUI(); }
async function gateSetPin(){
  const a = ($('#gatePin').value || '').trim(), c = ($('#gatePin2').value || '').trim();
  if(!/^\d{4}$/.test(a)){ gateErr('Your PIN must be 4 numbers'); return; }
  if(a !== c){ gateErr("The two PINs don't match"); return; }
  const pid = gatePid;
  const ok = await mutate(cur => {
    if(cur.members[pid] && cur.members[pid].pin) return 'abort';
    const m = cur.members[pid] || (cur.members[pid] = { admin:false });
    m.pin = a; m.t = Date.now();
  });
  if(!ok){
    if(lastAbort){ gateErr('Someone has already signed up as this name'); gateStep = 'names'; setTimeout(() => renderGate(true), 1200); }
    return;
  }
  saveSess(pid, a); finishSignIn();
}
function gateCheckPin(){
  const a = ($('#gatePin').value || '').trim();
  const m = league && league.members[gatePid];
  if(!m || !m.pin){ gateStep = 'setpin'; renderGate(true); return; }
  if(a !== m.pin){ gateErr('Wrong PIN'); return; }
  saveSess(gatePid, a); finishSignIn();
}
async function gateOrganiser(){
  const code = ($('#gateCode').value || '').trim();
  if(!code){ gateErr('Enter the code'); return; }
  let hex = '';
  try{ hex = await sha(code); }catch(e){ gateErr('Could not check the code here'); return; }
  if(hex !== EDITOR_PIN_HASH){ gateErr('Wrong code'); return; }
  organiser = true; try{ localStorage.setItem(LS_EDITOR, '1'); localStorage.setItem(LS_ORG, code); }catch(e){}
  finishSignIn();
}
function signOut(){
  organiser = false; guest = false;
  try{ localStorage.removeItem(LS_EDITOR); localStorage.removeItem(LS_SESS); localStorage.removeItem(LS_ORG); }catch(e){}
  gateOpen = true; gateStep = 'splash'; applyAuthUI();
}
function peopleStats(){
  const mem = league ? league.members : {};
  const ps = league ? league.players : [];
  const joined = ps.filter(p => mem[p.id] && mem[p.id].pin).length;
  return { joined:joined, total:ps.length, missing:ps.filter(p => !(mem[p.id] && mem[p.id].pin)) };
}
function notJoinedHtml(){
  const st = peopleStats();
  if(!st.total) return '';
  if(!st.missing.length) return '<div class="warn" style="background:#E7F5EC">✅ Everyone has joined the app.</div>';
  return '<div class="warn">📲 <b>' + st.missing.length + ' of ' + st.total + ' haven\'t got the app yet:</b> ' + st.missing.slice().sort(byName).map(p => esc(p.name)).join(', ') + '</div>';
}
function peopleHtml(){
  const mem = league.members, ps = league.players.slice().sort(byName);
  if(!ps.length) return '<div class="muted small">Add players first, then they can sign up with their name.</div>';
  let h = notJoinedHtml() + '<div class="hint" style="margin-bottom:8px">Each person taps their own name and chooses a 4-digit PIN. You can see every PIN here. Admins can see the Admin section and edit Pub Fines.</div>';
  h += ps.map(p => {
    const m = mem[p.id] || {}, joined = !!m.pin;
    return '<div class="adminrow"><div><div style="font-weight:600">' + esc(p.name) + (m.admin ? ' <span class="chip whites">Admin</span>' : '') + '</div>' +
      '<div class="muted small">' + (joined ? 'PIN <b style="letter-spacing:2px;color:var(--ink)">' + esc(m.pin) + '</b>' + ((m.push || []).length ? ' · 🔔' : '') : 'Not joined yet') + '</div></div>' +
      '<div class="row"><button class="btn ghost sm" data-act="mkadmin" data-pid="' + esc(p.id) + '" data-on="' + (m.admin ? '0' : '1') + '">' + (m.admin ? 'Remove admin' : 'Make admin') + '</button>' +
      (joined ? '<button class="btn ghost sm" data-act="resetpin" data-pid="' + esc(p.id) + '">Reset PIN</button>' : '') + '</div></div>';
  }).join('');
  return h;
}
function renderGate(force){
  const g = $('#gate'); if(!g) return;
  document.body.classList.toggle('gating', gateOpen);
  if(!gateOpen) return;
  if(!force && (gateStep === 'setpin' || gateStep === 'enterpin' || gateStep === 'organiser')) return;
  const logo = (document.querySelector('header.top img') || {}).src || '';
  const mark = '<img src="' + logo + '" alt=""><div class="gname">BBTNF</div>';
  let h = '';
  if(gateStep === 'splash'){
    h = mark + '<button class="btn red gbtn" data-act="gateEnter">Enter</button>';
  } else if(gateStep === 'names'){
    const ps = league ? league.players.slice().sort(byName) : [];
    h = '<img class="gsm" src="' + logo + '" alt=""><div class="gtitle">Tap your name</div>';
    if(!league && !loaded) h += '<div class="gnote">Loading…</div>';
    else if(!ps.length) h += '<div class="gnote">No players have been added yet.</div>';
    else h += '<div class="gnames">' + ps.map(p => '<button class="gname-b" data-act="gateName" data-pid="' + esc(p.id) + '">' + esc(p.name) + ((league.members[p.id] && league.members[p.id].pin) ? ' <span>✓</span>' : '') + '</button>').join('') + '</div>';
    h += '<div class="gnote">New here? Tap your own name to sign up. ✓ means already signed up.</div>' +
      '<div class="glinks"><button class="linkbtn" data-act="gateGuest">Just looking</button><button class="linkbtn" data-act="gateOrg">Organiser code</button></div>';
  } else if(gateStep === 'setpin' || gateStep === 'enterpin'){
    const p = league && league.players.find(x => x.id === gatePid);
    const set = gateStep === 'setpin';
    h = '<img class="gsm" src="' + logo + '" alt=""><div class="gtitle">' + esc(p ? p.name : '') + '</div>' +
      '<div class="gnote" style="margin-top:0">' + (set ? 'Choose a 4-digit PIN. Only you will use it to sign in. Don\'t use a bank PIN.' : 'Enter your PIN') + '</div>' +
      '<input type="password" id="gatePin" class="gin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····">' +
      (set ? '<input type="password" id="gatePin2" class="gin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="Again">' : '') +
      '<button class="btn red gbtn" data-go="1" data-act="' + (set ? 'gateSet' : 'gateGo') + '">' + (set ? 'Sign up' : 'Sign in') + '</button>' +
      '<div class="err" id="gateErr"></div>' +
      (set ? '' : '<div class="gnote">Forgotten it? Ask an admin to reset your PIN.</div>') +
      '<div class="glinks"><button class="linkbtn" data-act="gateBack">‹ Back to names</button></div>';
  } else {
    h = '<img class="gsm" src="' + logo + '" alt=""><div class="gtitle">Organiser code</div>' +
      '<input type="password" id="gateCode" class="gin" inputmode="numeric" autocomplete="off" placeholder="Code">' +
      '<button class="btn red gbtn" data-go="1" data-act="gateOrgGo">Sign in</button><div class="err" id="gateErr"></div>' +
      '<div class="glinks"><button class="linkbtn" data-act="gateBack">‹ Back to names</button></div>';
  }
  g.innerHTML = '<div class="ginner">' + h + '</div>';
}
function applyAuthUI(){
  refreshUser();
  const tab = document.querySelector('nav.tabs button[data-tab="admin"]');
  if(tab){
    tab.style.display = user ? '' : 'none';
    const bd = tab.querySelector('.bdg'); if(bd) bd.remove();
  }
  if(!user && currentTab === 'admin') showTab('home');
  const ft = $('#homeFoot');
  if(ft) ft.innerHTML = footHtml();
  renderGate(true); refreshPushState();
  renderAvail(); renderVoting(); renderFines(true); renderAdmin(true);
}

/* ================= Firebase wiring ================= */
function watchAvailability(){
  if(!db) return;
  const want = {};
  if(league){
    if(!availDate){ availDate = nextDate(); calMonth = availDate.slice(0, 7); }
    want[nextDate()] = 1; want[availDate] = 1; if(feeDate) want[feeDate] = 1;
  }
  Object.keys(unsubs).forEach(d => { if(!want[d]){ unsubs[d](); delete unsubs[d]; delete availBy[d]; } });
  Object.keys(want).forEach(d => {
    if(unsubs[d]) return;
    unsubs[d] = db.collection('availability').doc(d).onSnapshot(s => {
      availBy[d] = s.exists ? (s.data().responses || {}) : {};
      renderAvail(); renderHome(); renderAdmin();
    }, err => { console.error(err); });
  });
  renderAvail(); renderHome();
}

function start(){
  renderAll();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(e => console.error(e));
  if(typeof firebase === 'undefined'){ showBanner('Could not load — check your connection', true); return; }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ console.error(e); showBanner('Could not connect', true); return; }


  db.collection('league').doc('main').onSnapshot(s => {
    loaded = true;
    league = s.exists ? normalize(s.data()) : null;
    if(league){ try{ localStorage.setItem(LS_CACHE, JSON.stringify(league)); }catch(e){} }
    hideBanner();
    renderAll();
    refreshPushState();
    watchAvailability();
  }, err => {
    console.error(err);
    showBanner(league ? 'Offline — showing the last saved view' : 'Could not load — check your connection', true);
  });
}
start();
